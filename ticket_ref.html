<!-- 予約フォーム -->
<form id="reservationForm">
    <div>
        <label>お名前</label>
        <input type="text" id="name" required>
    </div>
    <div>
        <label>メールアドレス</label>
        <input type="email" id="email" required>
    </div>
    <div>
        <label>公演日時</label>
        <select id="date" required>
            <option value="5月20日 14:00">5月20日 14:00</option>
            <option value="5月21日 18:00">5月21日 18:00</option>
        </select>
    </div>
    <div>
        <label>券種</label>
        <select id="ticketType" required>
            <option value="一般">一般</option>
            <option value="U-25">U-25</option>
        </select>
    </div>
    <div>
        <label>枚数</label>
        <input type="number" id="count" min="1" max="5" value="1" required>
    </div>

    <button type="submit" id="submitBtn">予約を確定する</button>
    <div id="messageArea"></div>
</form>

<script>
    document.getElementById('reservationForm').addEventListener('submit', async (e) => {
        e.preventDefault(); // フォームの通常の画面遷移をストップ

        const submitBtn = document.getElementById('submitBtn');
        const messageArea = document.getElementById('messageArea');

        // 送信中のボタン連打防止
        submitBtn.disabled = true;
        submitBtn.textContent = '送信中...';

        // 送信するデータをJSONにまとめる
        const submitData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            date: document.getElementById('date').value,
            ticketType: document.getElementById('ticketType').value,
            count: document.getElementById('count').value
        };

        // ★ステップ3でコピーしたGASのWebアプリURL★
        const endpointUrl = 'https://script.google.com/macros/s/AKfycbxR6mw95aQD19kAdy8GmPek1mISja-c-GeUGA5xlPNRg6qcLwaJUzkYN7HvRsjMV7kO/exec';

        try {
            const response = await fetch(endpointUrl, {
                method: 'POST',
                // CORSエラーを回避するため text/plain を指定して送信する
                headers: {
                    'Content-Type': 'text/plain',
                },
                body: JSON.stringify(submitData)
            });

            const result = await response.json();

            if (result.status === "success") {
                messageArea.innerHTML = '<p style="color: green;">予約が完了しました！自動返信メールをご確認ください。</p>';
                document.getElementById('reservationForm').reset(); // フォームをクリア
            } else {
                messageArea.innerHTML = '<p style="color: red;">エラーが発生しました。</p>';
            }
        } catch (error) {
            messageArea.innerHTML = '<p style="color: red;">通信エラーが発生しました。</p>';
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '予約を確定する';
        }
    });
</script>
